<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>__TITLE__</title>
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<style>
:root{
  --bg:#f7f3ea; --paper:#fffdf8; --fg:#1d2126; --muted:#5f6670; --line:#d9d6cd;
  --accent:#1f5fd1; --accent-soft:#dfe8fb; --warn:#c2541b; --warn-soft:#fbe6d9; --ok:#2a8a5c;
  --sans:"Times New Roman",Times,"PingFang SC","Heiti SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#000; --paper:#111214; --fg:#e8e6df; --muted:#9aa1ab; --line:#333941;
  --accent:#6f9cf0; --accent-soft:#23334f; --warn:#f08a56; --warn-soft:#4a2a1a; --ok:#5ec48f; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#000; --paper:#111214; --fg:#e8e6df; --muted:#9aa1ab; --line:#333941;
  --accent:#6f9cf0; --accent-soft:#23334f; --warn:#f08a56; --warn-soft:#4a2a1a; --ok:#5ec48f; color-scheme:dark }
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:17px;line-height:1.8;margin:0}
.wrap{box-sizing:border-box;padding-inline:clamp(18px,9vw - 16px,200px);padding-block:40px 80px}
header{margin-bottom:48px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(28px,5vw,40px);line-height:1.2;margin:8px 0 12px;font-weight:700;text-wrap:balance}
.lede{color:var(--muted);margin:0}
section{margin-top:64px}
h2{font-size:22px;margin:0 0 6px;font-weight:700;text-wrap:balance}
h2 .n{color:var(--accent);font-weight:600;margin-right:10px;font-size:18px}
p{margin:12px 0}
p code,li code{font-size:.88em;background:var(--accent-soft);padding:1px 5px;border-radius:3px}
ul,ol{padding-left:1.2em}
.aside{border-left:3px solid var(--accent);padding:4px 0 4px 16px;margin:16px 0;font-size:15.5px}
.aside b{display:block;margin-bottom:2px}
.eq{margin:18px 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}
.eq .katex-display{margin:0}
.katex{font-size:1.08em}
.eq .katex-display>.katex{font-size:1.22em}
.lab{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:18px;margin:20px 0}
.ctrls{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;margin-bottom:14px}
.ctrl{display:flex;align-items:center;gap:10px;font-size:14px;flex-wrap:wrap}
.ctrl label{color:var(--muted);white-space:nowrap}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{background:none;border:0;padding:5px 11px;font:inherit;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff}
.seg.q button[aria-pressed=true]{background:var(--warn)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:none;border:1px solid var(--line);border-radius:4px;padding:5px 11px;font:inherit;font-size:13px;color:var(--muted);cursor:pointer}
.toggle{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px}
.toggle input{accent-color:var(--warn)}
svg{display:block;width:100%;height:auto}
svg text{font-family:var(--sans)}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px;font-variant-numeric:tabular-nums}
.ro{border-top:2px solid var(--line);padding-top:6px}
.ro b{display:block;font-size:20px;font-weight:600}
.ro span{font-size:12px;color:var(--muted)}
.ro.warn b{color:var(--warn)} .ro.ok b{color:var(--ok)}
.note{font-size:14px;color:var(--muted);margin:10px 0 0}
.sum{font-size:15px;margin-top:10px;line-height:1.9}
table{border-collapse:collapse;width:100%;font-size:14px;margin-top:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{font-weight:500;color:var(--muted);font-size:12px}
td.num{text-align:right}
.tw{overflow-x:auto}
.key{margin-top:40px;border-top:1px solid var(--line);padding-top:20px}
.clip{margin:20px 0}
.clip video{display:block;width:100%;height:auto;aspect-ratio:16/9;border-radius:10px;background:#111214}
</style>
<script>if(window.self!==window.top)document.documentElement.classList.add("embedded");try{var t=localStorage.getItem("d4a-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script></head>
<body>
<div class="wrap">
<header class="lab-intro">
  <div class="eyebrow">__KEYWORDS · SEPARATED · BY · DOTS__</div>
  <h1>__实验室标题__</h1>
  <p class="lede">__一两句话：这一讲要拆开看什么，实验都是真实计算__</p>
</header>

<section id="s1">
  <h2><span class="n">01</span>__第一个实验的标题__</h2>
  <p>__先给直觉，再说要做什么。__</p>
  <div class="lab">
    <div class="ctrls">
      <div class="ctrl"><label for="x1">__参数名__</label><input id="x1" type="range" min="1" max="10" step="1" value="4"><b id="x1v">4</b></div>
    </div>
    <svg id="fig1" viewBox="0 0 800 260" role="img" aria-label="__图的说明__"></svg>
    <div class="readout">
      <div class="ro"><b id="r1">–</b><span>__读数 1__</span></div>
      <div class="ro ok"><b id="r2">–</b><span>__读数 2__</span></div>
    </div>
    <p class="note">__注意看什么：一句话__</p>
  </div>
  <!-- 实验开头的说明同样一步一步写（见 SKILL.md 第 4 节）；需要静态分镜图时用 <figure class="fig"><svg>…</svg></figure>，颜色只用 CSS 变量 --></section>

</div>
<script src="/vendor/katex/katex.min.js"></script>
<script src="/vendor/katex/auto-render.min.js"></script>
<script>
/* 公式：行内 \( ... \)，独立 \[ ... \]；JS 里拼的公式用 katex.renderToString */
try{renderMathInElement(document.body,{delimiters:[{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false}],throwOnError:false});}catch(e){}
/* SVG 里的数学记号：mt(svg, x, y, [['q','i'],['·',''],['k','i'],['j','sub']], {属性}) */
function mt(p,x,y,parts,o={}){const NS='http://www.w3.org/2000/svg';const t=document.createElementNS(NS,'text');for(const k in Object.assign({x,y,'font-size':15},o))t.setAttribute(k,Object.assign({x,y,'font-size':15},o)[k]);parts.forEach(([s,k])=>{const sp=document.createElementNS(NS,'tspan');sp.textContent=s;if(k==='i')sp.setAttribute('font-style','italic');if(k==='sub'){sp.setAttribute('font-size','.72em');sp.setAttribute('dy','4');}t.appendChild(sp);});p.appendChild(t);return t;}
const $ = (s) => document.querySelector(s);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function draw1() {
  const k = +$('#x1').value; $('#x1v').textContent = k;
  // 真实计算放这里，不画假数据
  const y = k * k;
  $('#r1').textContent = k; $('#r2').textContent = y;
  const W = 800, H = 260, pad = 30;
  let s = `<line x1="${pad}" y1="${H - pad}" x2="${W - pad}" y2="${H - pad}" stroke="${css('--line')}"/>`;
  for (let i = 1; i <= 10; i++) {
    const x = pad + (i - 0.5) * (W - 2 * pad) / 10, h = (i * i) / 100 * (H - 2 * pad);
    s += `<rect x="${x - 14}" y="${H - pad - h}" width="28" height="${h}" rx="3" fill="${i === k ? css('--accent') : css('--line')}"/>`;
  }
  $('#fig1').innerHTML = s;
}
$('#x1').addEventListener('input', draw1);
const all = () => { draw1(); };
all();
// 主题切换（系统 / 网站外观菜单）后重画，颜色跟着 token 走
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', all);
new MutationObserver(all).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
</script>
<script>/* 图形尺寸上限：每张图按自身宽高比收窄并居中，高度不超过视口 62%（最多 620px）；文字、控件、读数仍铺满 */
(()=>{const sel='.lab svg,.lab canvas,figure svg,figure canvas,.clip video';
let busy=false;const fit=()=>{let redraw=false;let vh=innerHeight;try{if(window.top!==window)vh=window.top.innerHeight}catch(e){}const H=Math.min(vh*.62,620);document.querySelectorAll(sel).forEach(el=>{if(el.parentElement.closest('svg')||el.closest('button,label,.seg,.ro'))return;let w,h;if(el.tagName.toLowerCase()==='svg'){const vb=el.viewBox&&el.viewBox.baseVal;if(!vb||!vb.width)return;w=vb.width;h=vb.height}else if(el.tagName==='VIDEO'){w=16;h=9}else{w=el.width;h=el.height}if(!w||!h)return;const mw=Math.round(H*w/h)+'px';if(el.tagName==='CANVAS'&&el.style.maxWidth!==mw)redraw=true;el.style.maxWidth=mw;el.style.marginInline='auto';if(getComputedStyle(el).display==='inline')el.style.display='block'});
/* 画布的高度由实验自己按宽度算：尺寸变了就让实验重画一次 */if(redraw&&!busy){busy=true;dispatchEvent(new Event('resize'));busy=false}};
fit();addEventListener('load',fit);addEventListener('resize',fit);setTimeout(fit,600)})();</script>
</body>
</html>
